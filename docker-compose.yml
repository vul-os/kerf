# Default stack: just `app`, talking to its own embedded SQLite file at
# ~/.kerf/kerf.db (persisted in the kerf-home volume below). This matches
# the zero-dependency default documented in README.md's "Quick start" — no
# database server required, whether you install from source, via the
# installer script, or via `docker compose up`.
#
# Postgres is a one-line opt-in for shared / multi-user installs, same as
# it is from source (README: "Using Postgres instead"). Start it with the
# `postgres` profile and point DATABASE_URL at it:
#
#   DATABASE_URL=postgres://postgres:postgres@postgres:5432/kerf docker compose --profile postgres up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Override persona for local dev — 'full' installs every plugin.
      # For lighter images use: mech | electronics | bim | api-only | compute-only
      args:
        KERF_PERSONA: ${KERF_PERSONA:-full}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - ENV=${ENV:-local}
      # Unset (the default) -> kerf_core.db.config.default_database_url()
      # points at embedded SQLite under ~/.kerf/kerf.db inside the
      # container, matching the from-source default. Set DATABASE_URL (and
      # run with --profile postgres, see above) to use Postgres instead.
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-dev-pepper}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/data/storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - CDN_BASE_URL=${CDN_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-claude-sonnet-4-20250514}
      - LOCAL_MODE=${LOCAL_MODE:-true}
    volumes:
      - storage-data:/data/storage
      # Persists the embedded SQLite db (and WAL files) across `compose down`
      # the same way postgres-data persists the opt-in Postgres backend.
      - kerf-home:/root/.kerf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  # Opt-in only — `docker compose --profile postgres up`. A service gated by
  # a profile is never auto-started as a dependency, so `app` intentionally
  # does not `depends_on` this: the SQLite default must come up standalone.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kerf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  storage-data:
  postgres-data:
  kerf-home:
