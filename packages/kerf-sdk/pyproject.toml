[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-sdk"
version = "0.1.2"
description = "Python SDK for Kerf — talk to a Kerf instance over HTTP/JSON-RPC"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://vulos.org/projects/kerf/"
Repository = "https://github.com/kerf-sh/kerf"

[tool.hatch.build.targets.wheel]
packages = ["src/kerf"]

# Deliberately no [tool.pytest.ini_options] here. A per-package section
# shadows the repo-root one: pytest resolves rootdir to the NEAREST
# pyproject.toml containing that table, so any invocation scoped to this
# package (e.g. `pytest packages/kerf-x/tests/`) would silently skip the
# repo-root conftest.py (asyncio-loop shim, tools.* namespace shim) and its
# addopts = "--import-mode=importlib". See decisions.md, "pytest rootdir
# footgun" (2026-08-09), for the full diagnosis and proof. Config for every
# package lives in the root pyproject.toml only — do not add one here.
