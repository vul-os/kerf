[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-partsgen"
version = "0.1.8"
description = "Token-frugal, contributor-run pipeline that builds an original (MIT) parametric standard-parts library for the Kerf Workshop"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
# OCCT kernel: prod Kerf uses pythonocc-core; the contributor toolchain
# (and CI) uses cadquery, which binds the same OpenCASCADE kernel via OCP.
# Either binding satisfies kerf_partsgen.kernel.
kernel = [
    "cadquery>=2.6",
]
# `author` phase only — bounded LLM authoring. Contributors BYO key.
author = [
    "anthropic>=0.39",
]
dev = [
    "pytest>=8",
]

[project.scripts]
kerf-partsgen = "kerf_partsgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kerf_partsgen"]

# Deliberately no [tool.pytest.ini_options] here. A per-package section
# shadows the repo-root one: pytest resolves rootdir to the NEAREST
# pyproject.toml containing that table, so any invocation scoped to this
# package (e.g. `pytest packages/kerf-x/tests/`) would silently skip the
# repo-root conftest.py (asyncio-loop shim, tools.* namespace shim) and its
# addopts = "--import-mode=importlib". See decisions.md, "pytest rootdir
# footgun" (2026-08-09), for the full diagnosis and proof. Config for every
# package lives in the root pyproject.toml only — do not add one here.
