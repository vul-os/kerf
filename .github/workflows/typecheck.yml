name: Frontend typecheck + lint

# G1 TypeScript revamp (ROADMAP §Active program, T-500).
#
# The migration invariant is that the build stays green at EVERY commit — that is what makes
# concurrent agents on disjoint slices safe. This workflow is what enforces it.
#
# Three gates, in cheapest-first order:
#   1. typecheck        — tsc over all migrated .ts/.tsx (root config, strict:false)
#   2. typecheck:strict — tsc over the tightened allow-list (tsconfig.strict.json, strict:true)
#   3. lint:ts          — eslint over the MIGRATED TypeScript tree only
#   4. test             — the existing vitest suite, so a slice cannot regress behaviour
#
# Gate 2 is the ratchet: a directory added to tsconfig.strict.json can never silently regress.
#
# Gate 3 is scoped to .ts/.tsx on purpose. `npm run lint` over the whole repo reports ~1,451
# PRE-EXISTING errors in the un-migrated .js/.jsx tree — real debt, but not G1's, and gating on
# it would make this workflow red on every PR from day one, which trains people to ignore it.
#
# It is a RATCHET, not a hard zero. An earlier version of this file asserted lint:ts must be
# exactly 0, assuming migrated files start clean. That was measured to be false: linting the
# pre-migration .js of a representative file produced the identical error. A migration RENAMES a
# file, so its existing lint debt MOVES from the `lint` bucket into `lint:ts` — nothing new is
# created. A hard zero would fail CI for problems the slice did not cause.
#
# So the count may never rise (no slice may add debt), and when it falls the baseline in
# scripts/lint-ts-ratchet.mjs must be lowered (cleanup is locked in). Target is 0, at which point
# the ratchet can be replaced by a plain eslint call.

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck + lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # The lockfile lives in web/, not the repo root — setup-node
          # defaults to the root and fails the whole job without this.
          cache-dependency-path: web/package-lock.json
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (root — gradual, strict:false)
        run: npm run typecheck

      - name: Typecheck (strict allow-list — the tightening ratchet)
        run: npm run typecheck:strict

      - name: Lint ratchet (migrated TypeScript — see header)
        run: npm run lint:ts:ratchet

      - name: Unit tests
        run: npm test
