[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-chat"
version = "0.1.7"
description = "Kerf chat plugin: LLM chat and tool dispatch"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    # One client for every provider. This replaced direct dependencies on
    # anthropic, openai and google-genai, and with them three separate
    # opportunities for a chat call to 500 with ModuleNotFoundError because a
    # vendor SDK was missing from a deploy — which the frontend could only
    # report as the generic "The model returned an error" toast.
    #
    # Adding a provider is now a catalogue entry, not a dependency, an SDK to
    # learn and a fourth copy of the message translation.
    "litellm>=1.96.0",
    "kerf-core>=0.1.0",
    "kerf-api>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.entry-points."kerf.plugins"]
kerf-chat = "kerf_chat.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/kerf_chat"]
include = ["llm_docs/**/*.md"]

# Deliberately no [tool.pytest.ini_options] here. A per-package section
# shadows the repo-root one: pytest resolves rootdir to the NEAREST
# pyproject.toml containing that table, so any invocation scoped to this
# package (e.g. `pytest packages/kerf-x/tests/`) would silently skip the
# repo-root conftest.py (asyncio-loop shim, tools.* namespace shim) and its
# addopts = "--import-mode=importlib". See decisions.md, "pytest rootdir
# footgun" (2026-08-09), for the full diagnosis and proof. Config for every
# package lives in the root pyproject.toml only — do not add one here.
