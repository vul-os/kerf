[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-desktop"
version = "0.1.5"
description = "Kerf desktop — one-process, one-binary native app (FastAPI in a background thread + a native OS webview, frozen with PyInstaller). No sidecar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]

# The "lean" persona: everything the `mech` extra in the root pyproject.toml
# installs MINUS pythonOCC (kerf-cad-core[occ]) and FEniCSx/dolfinx
# (kerf-fem[fenicsx]) — both conda-forge-only, so neither pip-installs nor
# freezes with PyInstaller. kerf-cad-core and kerf-fem themselves ARE
# included below: their base packages (JSCAD/SDF/NURBS-adjacent geometry
# helpers, tessellation, sketch/mates solving) are pure pip/PyPI and degrade
# gracefully — per kerf_core.app's plugin loader, a plugin whose optional
# native solver is absent still registers and its tools report the solver
# missing rather than taking the app down. OCCT B-rep and real FEM solves are
# NOT available in this binary; `pip install kerf[mech]` (with the OCC/FEM
# conda extras) remains the path for those. See docs/desktop-build.md.
dependencies = [
    "kerf-core>=0.1.0",
    "kerf-auth>=0.1.0",
    "kerf-api>=0.1.0",
    "kerf-chat>=0.1.0",
    "kerf-cad-core>=0.1.0",
    "kerf-tess>=0.1.0",
    "kerf-fem>=0.1.0",
    "kerf-cam>=0.1.0",
    "kerf-topo>=0.1.0",
    "kerf-mates>=0.1.0",
    # Native OS webview: WebView2 on Windows, WebKit on macOS/Linux — NOT a
    # bundled Chromium. This is the desktop window; it is not needed by any
    # other persona and must not be added to kerf-core or any persona extra.
    "pywebview>=5.0",
]

[project.optional-dependencies]
# Only needed in the environment that RUNS PyInstaller to produce the
# frozen binary, never inside the binary itself. Kept separate from
# `dependencies` so a plain `pip install kerf-desktop` (e.g. to run
# `kerf-desktop` from source, unfrozen) doesn't pull in a build tool it has
# no use for.
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kerf-desktop = "kerf_desktop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kerf_desktop"]

# Deliberately no [tool.pytest.ini_options] here. A per-package section
# shadows the repo-root one: pytest resolves rootdir to the NEAREST
# pyproject.toml containing that table, so any invocation scoped to this
# package (e.g. `pytest packages/kerf-x/tests/`) would silently skip the
# repo-root conftest.py (asyncio-loop shim, tools.* namespace shim) and its
# addopts = "--import-mode=importlib". See decisions.md, "pytest rootdir
# footgun" (2026-08-09), for the full diagnosis and proof. Config for every
# package lives in the root pyproject.toml only — do not add one here.
