[tool.pytest.ini_options]
# DEFAULT TIER — the load-bearing product packages only.
#
# A bare `pytest` runs exactly this set, and this set is expected to be GREEN.
# That is the whole point: a red default is indistinguishable from background
# noise, so anything not currently green lives behind an explicit, documented
# command instead of being silently mixed in here. See docs/TESTING.md for the
# full tier map, the measured numbers, and the known root causes.
#
# Deliberately NOT here:
#   * packages/kerf-cad-core/tests — load-bearing geometry kernel, but ~38.8k
#     tests / ~75 min and 17 known failures + 2 non-terminating files. Run it
#     explicitly: `pytest packages/kerf-cad-core/tests` (see docs/TESTING.md).
#   * the remaining 21 engineering-domain packages (fem/cam/bim/electronics/
#     mold/...) — experimental tier, several are red. `make test-domains`.
#     kerf-rules moved into the default tier below: it is green and small
#     (69 tests), and its scope (a KBE rules engine invoked by product code)
#     makes it load-bearing rather than a domain-simulation package.
#   * kerf-billing has NO tests to add — the package was removed entirely in
#     6f0e66ba ("kerf is 100% MIT free software"); nothing under
#     packages/kerf-billing/ is tracked in git any more. If you see it
#     mentioned as a default-tier gap, that reference is stale.
#   * packages/kerf-v1/tests, packages/kerf-workers/tests — listed here for a
#     long time but neither directory has ever existed; pytest skipped them
#     silently. Removed rather than left as decorative entries.
testpaths = [
    "packages/kerf-cli/tests",
    "packages/kerf-core/tests",
    "packages/kerf-auth/tests",
    "packages/kerf-api/tests",
    "packages/kerf-chat/tests",
    "packages/kerf-pub/tests",
    "packages/kerf-sdk/tests",
    "packages/kerf-imports/tests",
    "packages/kerf-tess/tests",
    "packages/kerf-topo/tests",
    "packages/kerf-mates/tests",
    "packages/kerf-render/tests",
    "packages/kerf-parts/tests",
    "packages/kerf-partsgen/tests",
    "packages/kerf-worker/tests",
    "packages/kerf-plm/tests",
    "packages/kerf-rules/tests",
    "tests/install",
    "tests/perf",
]
asyncio_mode = "auto"
# importlib mode lets multiple plugin tests/ dirs coexist without conflicting
# package paths.
# Ignore tests for known-broken untracked straggler modules (sysml1d, explicit,
# si_refvalues, tracecurrent_refvalues). They are partial implementations from
# interrupted prior work; the test files remain in the working tree but the
# modules need a focused hardening pass. Drop the corresponding --ignore line
# once each module turns its suite green.
addopts = "--import-mode=importlib"
# `slow` is used by packages/kerf-cad-core/tests (deselect via `-m "not
# slow"`). Registered HERE, not in kerf-cad-core's own pyproject.toml, because
# this is the ONLY [tool.pytest.ini_options] table in the whole repo — see the
# note below.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    # Postgres is OPTIONAL in Kerf — a default install runs on embedded SQLite
    # at ~/.kerf/kerf.db. Tests that genuinely need Postgres carry this marker
    # AND skip themselves unless DATABASE_URL is set, so the core gate never
    # depends on a database server. Run them deliberately with:
    #   DATABASE_URL=postgres://... pytest -m postgres
    "postgres: requires a real Postgres instance (optional; not part of core testing)",
]

# ---------------------------------------------------------------------------
# Why this is the ONLY [tool.pytest.ini_options] table in the repo
# ---------------------------------------------------------------------------
# Every packages/kerf-*/pyproject.toml used to carry its own small
# [tool.pytest.ini_options] table (testpaths/asyncio_mode/markers/pythonpath).
# That was a footgun: pytest resolves `rootdir` (and its whole config) to the
# NEAREST pyproject.toml walking up from the invocation's args that contains
# a [tool.pytest.ini_options] table — a pyproject.toml without that table is
# skipped and the walk continues further up. So any single-package-scoped
# invocation (`pytest packages/kerf-core/tests/`, `make test-kernel`, an IDE
# test runner, a future CI job scoped to one package) silently stopped at the
# package's own table and never reached this one, which meant:
#   1. the repo-root conftest.py never loaded, so its Python-3.13
#      asyncio.get_event_loop compat shim never installed, and any later
#      legacy get_event_loop().run_until_complete(...) call raised
#      "There is no current event loop in thread 'MainThread'" for the rest
#      of that pytest process.
#   2. addopts = "--import-mode=importlib" below was silently replaced by
#      pytest's default `prepend` import mode.
# Deleting the per-package tables (instead of e.g. copying addopts into each
# one, or forcing -c/--rootdir on every call site) fixes this structurally:
# with no other [tool.pytest.ini_options] table anywhere in the tree, EVERY
# pytest invocation — however scoped, run by however careless a command —
# resolves rootdir up to this file, no flags required. Full diagnosis, the
# proven repro, and the alternatives considered are in decisions.md ("pytest
# rootdir footgun", 2026-08-09). Do not add a new
# [tool.pytest.ini_options] table to any packages/*/pyproject.toml — if a new
# package needs a package-specific pytest option (e.g. a marker), add it here
# with a comment noting which package it's for, the way `slow` is above.
