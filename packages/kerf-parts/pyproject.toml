[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-parts"
version = "0.1.9"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
description = "Contributor pipeline: fetch + convert pinned open-source CAD parts into Kerf's library (MIT; no data bundled)"
requires-python = ">=3.11"
# Pure stdlib + git subprocess. KiCad conversion reuses kerf-imports
# (which optionally needs kiutils); kerf-core is needed only by the DB
# seed step. Both are workspace siblings, not heavy new deps.
dependencies = []

[project.optional-dependencies]
seed = ["kerf-core", "kerf-imports"]

[project.scripts]
kerf-parts-fetch = "kerf_parts.fetch:main"
kerf-seed-parts = "kerf_parts.seed:main"

[project.entry-points."kerf.plugins"]
kerf-parts = "kerf_parts.plugin"

# Contributor tooling — deliberately NOT a kerf.plugins runtime entry point.

[tool.hatch.build.targets.wheel]
packages = ["src/kerf_parts"]

# Deliberately no [tool.pytest.ini_options] here. A per-package section
# shadows the repo-root one: pytest resolves rootdir to the NEAREST
# pyproject.toml containing that table, so any invocation scoped to this
# package (e.g. `pytest packages/kerf-x/tests/`) would silently skip the
# repo-root conftest.py (asyncio-loop shim, tools.* namespace shim) and its
# addopts = "--import-mode=importlib". See decisions.md, "pytest rootdir
# footgun" (2026-08-09), for the full diagnosis and proof. Config for every
# package lives in the root pyproject.toml only — do not add one here.
