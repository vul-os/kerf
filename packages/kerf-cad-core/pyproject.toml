[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-cad-core"
version = "0.1.4"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
description = "Shared pythonOCC base layer for Kerf CAD compute plugins"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    # Numerical stack — used throughout geom/, surfacing, FEM bridges, etc.
    # Declared here so every persona that includes kerf-cad-core (mech, full,
    # compute-only) ships with a working numpy/scipy at runtime.
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
occ = [
    "pythonocc-core",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Independent third-party ISO-10303-21 Part 21 grammar parser (MIT,
    # unrelated to Kerf) used only by
    # tests/test_step_ap242_writer.py::test_output_is_syntactically_valid_iso10303_21_per_third_party_parser
    # to verify step_ap242_writer's output — including its complex entity
    # instance syntax — parses as real Part 21, independent of Kerf's own
    # reader/writer code. Test-only; the writer itself has no runtime
    # dependency on it.
    "steputils>=0.1",
]

[project.entry-points."kerf.plugins"]
cad-core = "kerf_cad_core.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/kerf_cad_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
