[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-api"
version = "0.1.4"
description = "Kerf API plugin: REST surface for files, projects, workspaces"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "fastapi>=0.111.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "kerf-core>=0.1.0",
    "kerf-auth>=0.1.0",
    # routes_aero_airfoil.py imports numpy directly; declared so the kerf-api
    # plugin can register on every persona regardless of which compute
    # plugins (kerf-cad-core etc.) are also installed.
    "numpy>=1.26",
    # routes_git_diff.py imports pygit2 at module top level. Same reasoning as
    # numpy above, and the omission was load-bearing: without it the import
    # raised inside register(), the WHOLE kerf-api plugin failed to register, and
    # every /api/* route 404'd — which is what stranded 24 of 28 E2E specs on
    # page.waitForURL while /auth/* and /health answered 200.
    "pygit2>=1.14",
    # kerf_api/tools/*.py import kerf_chat.tools.registry UNGUARDED (configurations,
    # material, object_ops, revisions, scaffold, ...). Other packages wrap that import in
    # try/except with a _compat fallback; these do not, so a missing kerf-chat raises
    # inside register() and takes the WHOLE kerf-api plugin down — exactly what the
    # undeclared pygit2 did. CI masks it because the `full` persona installs everything;
    # a minimal install mounts 2 /api routes instead of ~200.
    "kerf-chat>=0.1.0",
    # routes.py imports kerf_tess at module level (line ~48), same as kerf_chat. The other
    # sibling imports in this package are either lazy or behind _try_include, which is
    # designed to swallow ImportError for optional sub-routers — those stay undeclared on
    # purpose. These two are eager, so a missing one fails register() outright.
    "kerf-tess>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.entry-points."kerf.plugins"]
kerf-api = "kerf_api.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/kerf_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
