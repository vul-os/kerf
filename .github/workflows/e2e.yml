name: E2E tests

# Runs on every PR and on pushes to main.
#
# No service containers. The suite runs against kerf-server on the embedded
# SQLite backend, serving the built frontend itself — the same shape as a
# default `pip install` and as the desktop binary. Postgres is optional in
# Kerf, so testing on it exclusively (which this job used to do) left the
# default install with no coverage at all; the move turned up three
# Postgres-only defects that 500'd on SQLite. See decisions.md and
# web/tests/e2e/playwright.config.ts.
#
# playwright.config.ts owns the rest: it boots two kerf-servers (:8081 local
# mode, :8082 server mode), and global-setup.ts creates and migrates their
# database files. There is nothing here to keep in sync with them.

on:
  pull_request:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `pip install -e .[full]` CANNOT work here: the repo is a uv workspace and
      # the kerf-* requirements are wired to packages/* via [tool.uv.sources],
      # which only uv reads. Plain pip goes to PyPI, where kerf-core et al. are
      # unpublished, and dies with "No matching distribution found for kerf-cli".
      # The per-package fallback failed for the same reason one level down
      # (kerf-api requires kerf-auth). dev-install.sh installs the persona's
      # packages editable in a SINGLE pip invocation so the inter-package
      # requirements resolve from the local checkout.
      - name: Install Python dependencies (full persona)
        run: ./scripts/dev-install.sh full

      # -----------------------------------------------------------------------
      # Node / frontend
      # -----------------------------------------------------------------------
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # The lockfile lives in web/, not the repo root — setup-node
          # defaults to the root and fails the whole job without this.
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # The suite serves this build from kerf-server, so it must exist before
      # Playwright starts. Its own config fails fast with this instruction if
      # it is missing, but building here keeps a vite failure in its own step
      # rather than buried in the test log.
      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Install e2e npm dependencies
        run: cd web/tests/e2e && npm ci

      - name: Install Playwright Chromium browser
        run: cd web/tests/e2e && npx playwright install --with-deps chromium

      # -----------------------------------------------------------------------
      # Run tests
      # -----------------------------------------------------------------------
      # DELIBERATELY NOT SET: DATABASE_URL. Leaving it unset is what selects the
      # embedded SQLite backend, which is the point of this job. Setting it to a
      # postgres:// DSN runs the identical suite against Postgres.
      - name: Run Playwright E2E tests
        env:
          CI: "true"
        run: cd web/tests/e2e && npm test

      # -----------------------------------------------------------------------
      # Artefacts (always uploaded so failures are debuggable)
      # -----------------------------------------------------------------------
      # These paths are relative to the workspace root, and the suite lives in
      # web/. They were missing that prefix, so every failing run logged "No
      # files were found with the provided path" and uploaded nothing — which
      # is why the last few red runs had no screenshots or traces to look at.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload failure artefacts (screenshots + videos + traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: web/tests/e2e/test-results/
          retention-days: 7
