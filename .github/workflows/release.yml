# Kerf release workflow
#
# Triggered by pushing a version tag (v*) — but NOT sdk-v* tags (those
# trigger packages/kerf-sdk/.github/workflows/publish.yml instead).
#
# What this does:
#   1. `docker`    — builds a Docker image for each persona (full, mech,
#                    electronics, bim) using the repo-root Dockerfile and the
#                    KERF_PERSONA build-arg, and pushes to GitHub Container
#                    Registry (ghcr.io/vul-os/kerf). :latest and :<version>
#                    point to the "full" persona; :<version>-<persona> are
#                    the persona variants.
#   2. `artifacts` — builds the frontend once and assembles installable
#                    tarballs: kerf-<tag>-macos-arm64.tar.gz,
#                    -macos-x64.tar.gz, -linux-x64.tar.gz (identical
#                    contents — Kerf is Python + Node, not a compiled
#                    binary, so there's nothing to cross-compile per OS yet;
#                    see install.sh's comment and docs/releasing.md for the
#                    single-binary TODO), a universal -src.tar.gz (`git
#                    archive` of the tag), the frontend dist tarball and a
#                    tag-stamped copy of install.sh.
#   3. `wheels`    — Python wheels for packages/kerf-* (except kerf-sdk,
#                    which has its own PyPI cadence on sdk-v* tags).
#   4. `sbom`      — CycloneDX SBOMs for the Python and npm dependency trees.
#   5. `desktop`   — matrix build (macOS/Windows/Linux) of the one-file
#                    kerf-desktop binary via scripts/build-desktop.sh and
#                    packages/kerf-desktop/kerf-desktop.spec. Ships the LEAN
#                    persona: OCCT B-rep (pythonOCC) and real FEM
#                    (FEniCSx/dolfinx) are conda-forge-only and cannot be
#                    frozen by PyInstaller, so they are NOT in these
#                    binaries — see docs/desktop-build.md.
#   6. `publish`   — stages EVERY asset from 2–5 into one directory, writes
#                    SHA256SUMS over that directory, verifies it with the same
#                    scripts/verify.sh a user runs, attaches a sigstore build
#                    provenance attestation, and creates ONE GitHub Release
#                    using the matching CHANGELOG.md section as the notes.
#
# ── Why every asset is built in THIS workflow ───────────────────────────────
# Jobs 3 and 4 used to live in a second workflow (release-artifacts.yml) that
# fired on the same tag and attached wheels, the frontend tarball, install.sh
# and the SBOMs to the release directly. SHA256SUMS was written in this file,
# over this file's tarballs only. The result was a release where four of the
# nine assets were covered by the manifest and the rest were not — and nothing
# said which was which, so `verify.sh <a wheel>` failed with "no entry" on a
# file the project had in fact published. Two workflows racing to attach to one
# release cannot share a manifest; one workflow with one staging directory can.
#
# The rule that keeps it true: everything published lands in `release-out/`
# and nothing else does. The manifest covers that directory, so "published"
# and "covered" are the same set by construction rather than two lists someone
# keeps in sync by hand.
#
# ── Signing ─────────────────────────────────────────────────────────────────
# `publish` attaches a sigstore BUILD PROVENANCE attestation over release-out/*
# (actions/attest-build-provenance, signed with a short-lived certificate
# minted from the job's OIDC token — no long-lived key, no repository secret,
# nothing to rotate). It binds the bytes to "this repo's release workflow at
# this commit"; a downloader checks it with `gh attestation verify` or
# `verify.sh --attest`. It is NOT OS code-signing and NOT load-bearing for
# integrity: verify.sh's digest path needs only curl and sha256sum.
#
# Usage:
#   ./scripts/bump-version.sh 0.2.0   # or: make release VERSION=0.2.0
#   git tag v0.2.0 && git push origin v0.2.0

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'        # matches v0.1.0, v1.2.3, …
      - '!sdk-v*'        # tag-filter exclusion (belt-and-suspenders — the
                          # sdk workflow only fires on sdk-v* anyway)

permissions:
  contents: write      # create GitHub Release + upload assets
  packages: write      # push to ghcr.io

jobs:
  # ── Docker images (GHCR) ─────────────────────────────────────────────────
  docker:
    name: Build, push Docker images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        persona:
          - full
          - mech
          - electronics
          - bim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip the leading 'v' for Docker tags (v0.1.0 → 0.1.0)
      - name: Derive version string
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME}"          # e.g. v0.1.0
          VERSION="${RAW#v}"                # e.g. 0.1.0
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Persona-specific image ──────────────────────────────────────────
      # Every persona gets a :<version>-<persona> tag.
      # The "full" persona additionally gets :<version> and :latest.
      # DOCKER_BUILD_RECORD_UPLOAD: false — buildx otherwise auto-uploads a
      # "<org>~<repo>~<random>.dockerbuild" workflow artifact per invocation
      # (5 of them across this job: 4 personas + the "full" retag below).
      # Nobody reads them; worse, `publish`'s `download-artifact` step used to
      # match them via `pattern: "*"` and they are the artifacts that were
      # failing with "Artifact download failed after 5 retries" — see the
      # comment on that step for the run-log evidence. Turning off the
      # upload at the source means there is nothing left for a future
      # broad pattern to accidentally sweep in.
      - name: Build and push (${{ matrix.persona }})
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          build-args: |
            KERF_PERSONA=${{ matrix.persona }}
          tags: |
            ghcr.io/vul-os/kerf:${{ steps.ver.outputs.version }}-${{ matrix.persona }}
          cache-from: type=gha,scope=${{ matrix.persona }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.persona }}

      # ── Canonical tags for "full" only ─────────────────────────────────
      - name: Tag full persona as :version and :latest
        if: matrix.persona == 'full'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          build-args: |
            KERF_PERSONA=full
          tags: |
            ghcr.io/vul-os/kerf:${{ steps.ver.outputs.version }}
            ghcr.io/vul-os/kerf:latest
          cache-from: type=gha,scope=full
          cache-to:   type=gha,mode=max,scope=full

  # ── Installable tarballs (frontend + Python source + venv installer) ────
  artifacts:
    name: Build release tarballs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The lockfile lives in web/, not the repo root — setup-node
          # defaults to the root and fails the whole job without this.
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund  # npm install (not ci): lockfiles written on macOS drop platform-conditional optional deps (npm/cli#4828)

      - name: Build frontend
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Assemble release bundle + tarballs
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"                 # e.g. v0.1.0
          STAGE="kerf-${TAG}"
          mkdir -p "release/${STAGE}"

          # Pre-built frontend
          cp -r web/dist "release/${STAGE}/dist"

          # Python plugin packages (source only, no kerf-sdk — it has its
          # own PyPI release cadence via sdk-v* tags) and repo metadata the
          # bundled setup.sh / a self-hoster needs.
          mkdir -p "release/${STAGE}/packages"
          for pkg_dir in packages/kerf-*/; do
            pkg="$(basename "$pkg_dir")"
            [ "$pkg" = "kerf-sdk" ] && continue
            rsync -a \
              --exclude '__pycache__' --exclude '*.pyc' \
              --exclude '.pytest_cache' --exclude '.mypy_cache' \
              --exclude 'node_modules' --exclude '.venv' --exclude 'dist' \
              --exclude '*.egg-info' \
              "$pkg_dir" "release/${STAGE}/packages/${pkg}/"
          done

          cp pyproject.toml kerf.example.toml README.md LICENSE CHANGELOG.md VERSION \
            "release/${STAGE}/"
          cp scripts/bundled-setup.sh "release/${STAGE}/setup.sh"
          chmod +x "release/${STAGE}/setup.sh"

          # Identical contents per OS label — see the header comment in
          # install.sh and the "single-binary TODO" note in docs/releasing.md.
          mkdir -p release-out
          ( cd release && for os in macos-arm64 macos-x64 linux-x64; do
              tar -czf "../release-out/kerf-${TAG}-${os}.tar.gz" "${STAGE}"
            done )

          # Universal source tarball straight from the tagged commit (for
          # anyone who wants the full monorepo, incl. kerf-sdk, tests/, etc.)
          git archive --format=tar.gz --prefix="${STAGE}-src/" -o "release-out/kerf-${TAG}-src.tar.gz" "$TAG"

          # Frontend dist tarball, from the SAME `npm run build` above — the
          # second workflow used to rebuild it in a job of its own, which meant
          # two builds of the same commit and no guarantee the bytes matched.
          VERSION="${TAG#v}"
          tar -czf "release-out/kerf-frontend-${VERSION}.tar.gz" -C web/dist .

          # Verbatim, tag-stamped copy of install.sh. It is NOT pinned to the
          # tag: install.sh resolves the latest release at run time unless
          # KERF_VERSION is set.
          cp install.sh "release-out/kerf-install-${TAG}.sh"

          # Presence check only. SHA256SUMS is written once, in `publish`, over
          # every asset from every job — writing a manifest here would cover
          # this job's output and silently omit the wheels and SBOMs, which is
          # the exact bug this workflow was restructured to remove.
          for os in macos-arm64 macos-x64 linux-x64 src; do
            asset="kerf-${TAG}-${os}.tar.gz"
            [ -f "release-out/${asset}" ] || { echo "::error::missing tarball ${asset}"; exit 1; }
          done
          [ -f "release-out/kerf-frontend-${VERSION}.tar.gz" ] || { echo "::error::missing frontend tarball"; exit 1; }
          [ -s "release-out/kerf-install-${TAG}.sh" ] || { echo "::error::missing install.sh copy"; exit 1; }
          ls -la release-out

      # Split across two artifacts rather than one. NOTE: the original justification for this
      # split — that a ~177 MB artifact was too large for `download-artifact` — was WRONG, and the
      # run logs disprove it: the unsplit 177 MB artifact downloaded fine on every run. The actual
      # cause of "Artifact download failed after 5 retries" was `pattern: "*"` in the publish job
      # matching buildx's auto-uploaded `.dockerbuild` artifacts (see the comment on that step).
      #
      # The split is kept because it is harmless and smaller artifacts are marginally quicker, not
      # because it fixes anything. Publishing globs `release-out/*`, so how many artifacts the
      # bytes arrive in does not change what gets released.
      - name: Upload platform tarballs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: |
            release-out/kerf-*-macos-arm64.tar.gz
            release-out/kerf-*-macos-x64.tar.gz
            release-out/kerf-*-linux-x64.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload source, frontend and installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarballs-aux
          path: |
            release-out/kerf-*-src.tar.gz
            release-out/kerf-frontend-*.tar.gz
            release-out/kerf-install-*.sh
          retention-days: 1
          if-no-files-found: error

  # ── Python wheels ────────────────────────────────────────────────────────
  # Moved here from release-artifacts.yml. It no longer attaches to the
  # release itself: it hands its output to `publish`, which is the one job
  # that writes the manifest and the one job that uploads.
  wheels:
    name: Build Python wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: pip install --quiet build

      - name: Build wheels for all packages (except kerf-sdk)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-wheels

          for pkg_dir in packages/kerf-*/; do
            pkg=$(basename "$pkg_dir")
            # kerf-sdk has its own PyPI publish flow; skip here
            [[ "$pkg" == "kerf-sdk" ]] && continue
            # non-Python SDK bindings (kerf-sdk-go/-rs/-lua/-ts) have no pyproject
            [[ -f "$pkg_dir/pyproject.toml" || -f "$pkg_dir/setup.py" ]] || continue

            echo "::group::Building $pkg"
            (
              cd "$pkg_dir"
              python -m build --wheel --outdir ../../release-wheels/
            )
            echo "::endgroup::"
          done

          # A wheels job that built no wheels must not be a green tick: the
          # release would then quietly ship without them.
          count=$(find release-wheels -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "::error::no wheels were built"; exit 1; }
          echo "Built ${count} wheel(s):"
          ls -lh release-wheels/

      # Bundle the wheels into ONE archive rather than attaching ~40 loose
      # .whl files to the release. A release page listing forty wheels buries
      # the four downloads a human actually wants (the platform tarballs), and
      # nobody installs Kerf by picking wheels off a web page one at a time.
      # The bundle stays in release-out/, so SHA256SUMS and the provenance
      # attestation still cover every wheel byte.
      - name: Bundle wheels into a single archive
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-wheels-bundle
          tar czf "release-wheels-bundle/kerf-wheels-${VERSION}.tar.gz" -C release-wheels .
          ls -lh release-wheels-bundle/

      - name: Upload wheels as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: release-wheels-bundle/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ── SBOMs ────────────────────────────────────────────────────────────────
  # Moved here from release-artifacts.yml, same reason as `wheels`.
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # The lockfile lives in web/, not the repo root — setup-node
          # defaults to the root and fails the whole job without this.
          cache-dependency-path: web/package-lock.json
      - name: Install Python packages for SBOM scan
        shell: bash
        run: |
          set -euo pipefail
          # Install all workspace packages in ONE pip invocation so the
          # kerf-* cross-dependencies resolve against each other locally
          # instead of being looked up (and not found) on PyPI.
          args=()
          for d in packages/kerf-*/; do
            [ -f "${d}pyproject.toml" ] && args+=(-e "$d")
          done
          pip install --quiet "${args[@]}"

      - name: Generate Python SBOM (CycloneDX)
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-sbom

          # `sbom` is a plain shell variable, NOT read back from $GITHUB_ENV.
          # A value written to $GITHUB_ENV is not visible to the step that
          # wrote it, so the previous `if [[ -z "${PYTHON_SBOM:-}" ]]` test was
          # ALWAYS true: the pip-freeze fallback ran even when CycloneDX had
          # just succeeded, and its filename won the last-write-wins race in
          # the env file. Releases advertised a CycloneDX SBOM and shipped a
          # pip freeze under the name.
          sbom=""
          if pip install --quiet cyclonedx-py 2>/dev/null; then
            if cyclonedx-py environment \
                 --output-format JSON \
                 --outfile "release-sbom/kerf-python-sbom-${VERSION}.json"; then
              sbom="release-sbom/kerf-python-sbom-${VERSION}.json"
            fi
          fi

          if [ -z "$sbom" ]; then
            echo "::warning::cyclonedx-py unavailable or failed — publishing a pip-freeze manifest instead, which is NOT a CycloneDX SBOM."
            pip freeze > "release-sbom/kerf-python-deps-${VERSION}.txt"
            sbom="release-sbom/kerf-python-deps-${VERSION}.txt"
          fi
          echo "Python dependency manifest: ${sbom}"

      - name: Install npm dependencies
        working-directory: web
        run: npm install --no-audit --no-fund  # npm install (not ci): lockfiles written on macOS drop platform-conditional optional deps (npm/cli#4828)

      # working-directory matters and its absence is not visible in the output:
      # the frontend moved to web/ and this step did not follow it, so both
      # tools ran from a repo root with no package.json. cyclonedx-npm failed,
      # `npm ls --json` succeeded with the literal `{}`, and the `-s` guard
      # below passed because two bytes is not empty. v0.1.8 shipped an npm SBOM
      # declaring that Kerf's frontend has no dependencies.
      - name: Generate npm SBOM (CycloneDX)
        shell: bash
        working-directory: web
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="${GITHUB_WORKSPACE}/release-sbom"
          mkdir -p "$OUT"

          if npx --yes @cyclonedx/cyclonedx-npm \
               --output-file "${OUT}/kerf-npm-sbom-${VERSION}.json" \
               --output-format JSON; then
            sbom="${OUT}/kerf-npm-sbom-${VERSION}.json"
            components=$(node -e "process.stdout.write(String((require('$sbom').components||[]).length))")
            [ "$components" -gt 0 ] \
              || { echo "::error::CycloneDX SBOM lists ${components} components — refusing to publish an empty SBOM"; exit 1; }
            echo "npm SBOM: ${sbom} (${components} components)"
          else
            echo "::warning::cyclonedx-npm failed — publishing 'npm ls' output instead, which is NOT a CycloneDX SBOM."
            npm ls --json > "${OUT}/kerf-npm-deps-${VERSION}.json" || true
            # Content, not size. `npm ls` outside a package prints `{}`, which
            # is a passing -s check and a worthless artifact.
            deps=$(node -e "process.stdout.write(String(Object.keys((require('${OUT}/kerf-npm-deps-${VERSION}.json').dependencies)||{}).length))" 2>/dev/null || echo 0)
            [ "$deps" -gt 0 ] \
              || { echo "::error::npm dependency manifest lists ${deps} dependencies — neither a CycloneDX SBOM nor a usable fallback could be produced"; exit 1; }
            echo "npm dependency manifest: ${deps} direct dependencies"
          fi

      - name: Upload SBOMs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: release-sbom/*
          retention-days: 1
          if-no-files-found: error

  # ── Desktop binaries (macOS / Windows / Linux) ───────────────────────────
  # One-file kerf-desktop binary per OS, via scripts/build-desktop.sh and
  # packages/kerf-desktop/kerf-desktop.spec (unchanged from the existing,
  # macOS-verified local build path — this job just runs it on three
  # runners). Ships the LEAN persona only: pythonOCC (OCCT B-rep) and
  # FEniCSx/dolfinx (real FEM) are conda-forge-only, so PyInstaller cannot
  # freeze them — those stay out of every binary here. `pip install
  # kerf[mech]` into a conda env remains the path for OCCT/FEM. See
  # docs/desktop-build.md.
  desktop:
    name: Build desktop binary (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset_suffix: macos-arm64
            artifact_name: desktop-macos-arm64
          - runner: windows-latest
            asset_suffix: windows-x64.exe
            artifact_name: desktop-windows-x64
          - runner: ubuntu-latest
            asset_suffix: linux-x64
            artifact_name: desktop-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The lockfile lives in web/, not the repo root — setup-node
          # defaults to the root and fails the whole job without this.
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund  # npm install (not ci): lockfiles written on macOS drop platform-conditional optional deps (npm/cli#4828)

      # pywebview has no bundled Chromium: on Linux it renders through
      # WebKitGTK via WebKit2GTK + PyGObject bindings, neither of which
      # ships with the ubuntu-latest image. libwebkit2gtk-4.1-dev /
      # gir1.2-webkit2-4.1 are the WebKitGTK runtime + typelib (ubuntu-24.04
      # dropped the older 4.0 packages); the rest are dev headers that
      # scripts/build-desktop.sh needs to `pip install pygobject pycairo`
      # into the build venv (see that script's comment on why it does this
      # itself rather than relying on apt's python3-gi, which is bound to
      # the system interpreter, not the venv actions/setup-python creates).
      - name: Install WebKitGTK (Linux runtime deps for pywebview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config gcc python3-dev

      # Windows uses WebView2, which ships with the windows-latest image —
      # nothing to install for it. macOS uses WebKit via pywebview's Cocoa
      # backend, also part of the OS — nothing to install there either.
      # Built as its own step, NOT inside build-desktop.sh. When all three
      # desktop legs failed on v0.1.7, `vite build` exited 1 with no visible
      # error because its output was buried in the script's subshell — the run
      # log ended on a routine warning then "exit code 1", which is
      # undiagnosable. A dedicated step surfaces the real failure.
      - name: Build frontend (web/dist)
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Build desktop binary
        shell: bash
        env:
          # actions/setup-python puts `python3` on PATH on macOS/Linux, but
          # only `python` on Windows.
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          # web/dist was built by the step above; do not rebuild it.
          KERF_SKIP_FRONTEND_BUILD: "1"
        run: ./scripts/build-desktop.sh

      - name: Stage desktop binary
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-out

          src="packages/kerf-desktop/dist/kerf-desktop"
          [ -f "${src}.exe" ] && src="${src}.exe"
          if [ ! -f "$src" ]; then
            echo "::error::built binary not found at $src"
            exit 1
          fi

          dest="release-out/kerf-desktop-${TAG}-${{ matrix.asset_suffix }}"
          cp "$src" "$dest"
          chmod +x "$dest" || true
          ls -la release-out

      - name: Upload desktop binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/kerf-desktop-*
          retention-days: 1
          if-no-files-found: error

  # ── Create the GitHub Release ────────────────────────────────────────────
  publish:
    name: Publish GitHub Release (checksummed + attested)
    runs-on: ubuntu-latest
    needs: [docker, artifacts, wheels, sbom, desktop]
    permissions:
      contents: write       # create the Release and upload assets
      packages: write       # inherited default kept explicit
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the attestation against this repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # EVERY asset from every build job, merged into ONE directory. Nothing
      # else writes here, and nothing else is uploaded to the release — that is
      # what makes "published" and "covered by SHA256SUMS" the same set.
      #
      # Named explicitly, NOT `pattern: "*"` + `merge-multiple: true`. That
      # wildcard also matched the "<org>~<repo>~<random>.dockerbuild" build-record
      # artifacts that docker/build-push-action auto-uploads (one per
      # build-push-action invocation in the `docker` job — 5 of them: 4
      # personas + the "full" retag). Run logs from the two most recent
      # failures (31191723253, 31190796084) show every one of OUR artifacts
      # (sbom, python-wheels, release-tarballs[-aux]) logging "Artifact
      # download completed successfully" — including the single 177 MB
      # release-tarballs in 31190796084, before the split — while the run
      # then dies on "Unable to download and extract artifact: Artifact
      # download failed after 5 retries" without ever logging a completion
      # for any of the 5 `.dockerbuild` artifacts. Same pattern both times:
      # our artifacts always finish; the unrelated auto-generated ones never
      # do. Size was a red herring (see the `artifacts` job comment on the
      # split — kept for the unrelated benefit of smaller individual
      # downloads, not because it fixes this). The `docker` job now also
      # sets DOCKER_BUILD_RECORD_UPLOAD: false so these artifacts stop being
      # created at all; downloading by exact name here is the belt to that
      # suspenders, so a future artifact this workflow doesn't own can never
      # again be swept in by a broad pattern.
      - name: Stage release tarballs
        uses: actions/download-artifact@v4
        with:
          path: release-out
          name: release-tarballs

      - name: Stage source/frontend/installer tarballs
        uses: actions/download-artifact@v4
        with:
          path: release-out
          name: release-tarballs-aux

      - name: Stage Python wheels
        uses: actions/download-artifact@v4
        with:
          path: release-out
          name: python-wheels

      - name: Stage SBOMs
        uses: actions/download-artifact@v4
        with:
          path: release-out
          name: sbom

      # The `desktop` matrix job uploads three separately-named artifacts
      # (desktop-macos-arm64, desktop-windows-x64, desktop-linux-x64) because
      # upload-artifact requires a unique name per invocation within a run —
      # matrix jobs can't all upload under one shared name. `pattern` +
      # `merge-multiple` is the intended way to fan them back into one
      # directory. This is NOT the banned `pattern: "*"` from the comment on
      # "Stage release tarballs" above: it is scoped to names this workflow
      # itself defines (the `desktop` job's `matrix.artifact_name`), so it
      # cannot match docker/build-push-action's auto-uploaded
      # "*.dockerbuild" artifacts or any other job's artifact name.
      - name: Stage desktop binaries
        uses: actions/download-artifact@v4
        with:
          path: release-out
          pattern: desktop-*
          merge-multiple: true

      # The set that MUST be there. The manifest below covers whatever is in
      # release-out/, which is necessary but not sufficient: a build job that
      # produced nothing would yield a smaller release with a perfectly
      # consistent manifest. This is the "did every job actually deliver"
      # half, and it replaces the old cross-workflow `verify` job that asked
      # the GitHub API which assets got attached after the fact.
      - name: Assert every expected asset is staged
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          missing=()

          for os in macos-arm64 macos-x64 linux-x64 src; do
            [ -f "release-out/kerf-${TAG}-${os}.tar.gz" ] || missing+=("kerf-${TAG}-${os}.tar.gz")
          done
          [ -f "release-out/kerf-frontend-${VERSION}.tar.gz" ] || missing+=("kerf-frontend-${VERSION}.tar.gz")
          [ -s "release-out/kerf-install-${TAG}.sh" ]         || missing+=("kerf-install-${TAG}.sh")

          # `find | wc -l`, not a glob: an unmatched glob under `set -u` is a
          # literal string, which `[ -f ]` then reports as merely absent.
          # Wheels ship as one bundle rather than ~40 loose .whl files (see the
          # "Bundle wheels" step). Assert the bundle exists AND is non-empty —
          # a zero-wheel tarball would otherwise satisfy a bare existence check
          # and quietly ship a release with no wheels in it.
          _wheel_bundle="release-out/kerf-wheels-${VERSION}.tar.gz"
          if [ ! -s "$_wheel_bundle" ]; then
            missing+=("kerf-wheels-${VERSION}.tar.gz")
          elif [ "$(tar tzf "$_wheel_bundle" | grep -c '\.whl$')" -eq 0 ]; then
            missing+=("at least one Python wheel inside kerf-wheels-${VERSION}.tar.gz")
          fi
          [ "$(find release-out -maxdepth 1 \( -name "kerf-python-sbom-${VERSION}.json" -o -name "kerf-python-deps-${VERSION}.txt" \) | wc -l | tr -d ' ')" -gt 0 ] \
            || missing+=("a Python dependency manifest")
          [ "$(find release-out -maxdepth 1 \( -name "kerf-npm-sbom-${VERSION}.json" -o -name "kerf-npm-deps-${VERSION}.json" \) | wc -l | tr -d ' ')" -gt 0 ] \
            || missing+=("an npm dependency manifest")

          # Desktop binaries, one per OS — see the `desktop` job. `-s`
          # (non-empty), not just `-f`: a PyInstaller run that "succeeded"
          # but produced a truncated/zero-byte binary must not pass this
          # gate.
          for suffix in macos-arm64 "windows-x64.exe" linux-x64; do
            [ -s "release-out/kerf-desktop-${TAG}-${suffix}" ] || missing+=("kerf-desktop-${TAG}-${suffix}")
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release-out/ is missing expected asset(s):"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All expected assets are staged:"
          ls -la release-out

      # ONE manifest, over the whole staging directory, written after every
      # build job has delivered. install.sh and scripts/verify.sh both abort
      # when SHA256SUMS is missing or does not list the asset they were asked
      # about, so an asset the manifest omits is an asset nobody can install.
      - name: Emit SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-out

          mapfile -t ASSETS < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort)

          # FAIL CLOSED: a run where every build silently produced nothing must
          # be a red release, not a green one with an empty manifest. An empty
          # SHA256SUMS vouches for nothing while looking exactly like one that
          # vouched for everything.
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::release-out/ contains no assets — refusing to publish a release whose manifest would vouch for nothing."
            exit 1
          fi

          : > SHA256SUMS
          for a in "${ASSETS[@]}"; do
            sha256sum "$a" >> SHA256SUMS
          done

          # COVERAGE ASSERTION. Without it the step is trivially satisfiable: a
          # one-line manifest "covers" a nine-asset release and every later
          # check still passes.
          LINES="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "$LINES" -ne "${#ASSETS[@]}" ]; then
            echo "::error::SHA256SUMS has ${LINES} line(s) for ${#ASSETS[@]} staged asset(s) — the manifest does not cover the release."
            exit 1
          fi

          echo "SHA256SUMS covers ${#ASSETS[@]} asset(s):"
          cat SHA256SUMS
          printf '%s\n' "${ASSETS[@]}" > "${RUNNER_TEMP}/release-assets.txt"

      # The producer checked by the consumer, before anything is public. If
      # verify.sh and the emit step ever disagree about the manifest format,
      # it surfaces here in a red release job rather than in a user's terminal.
      - name: Verify SHA256SUMS with the same script users run
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ASSETS < "${RUNNER_TEMP}/release-assets.txt"
          bash scripts/verify.sh --dir release-out "${ASSETS[@]}"

          # The other direction. verify.sh proves every asset it was NAMED
          # matches; this proves nothing reached release-out/ after the
          # manifest was written. Since the release step publishes the whole
          # directory, an unlisted file would be attached under a manifest that
          # says nothing about it, and install.sh/verify.sh would then refuse
          # it — that has to be a red build here, not a dead end for a user.
          diff <(find release-out -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort) \
               <(awk '{ n = $2; sub(/^\*/, "", n); print n }' release-out/SHA256SUMS | LC_ALL=C sort) \
            || { echo "::error::release-out/ and SHA256SUMS disagree (< staged, > listed) — refusing to publish."; exit 1; }

      # A verifier whose refusals are never exercised is a verifier that has
      # probably stopped refusing. 24 synthetic-origin cases, asserting the
      # exit code AND that a diagnostic was actually printed.
      - name: Prove the verifier still refuses broken releases
        run: bash scripts/verify.sh --selftest

      # Pull the "## [X.Y.Z] - ..." section out of CHANGELOG.md (strict
      # Keep a Changelog headers) and use it verbatim as the release body.
      - name: Extract CHANGELOG section for this version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${VERSION} — falling back to a minimal note."
            {
              echo "## [${VERSION}]"
              echo ""
              echo "See [CHANGELOG.md](https://github.com/vul-os/kerf/blob/main/CHANGELOG.md)."
            } > notes.md
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "## Container images"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/vul-os/kerf:${VERSION}"
            echo '```'
            echo ""
            echo "| Tag | Persona |"
            echo "|-----|---------|"
            echo "| \`ghcr.io/vul-os/kerf:${VERSION}\` | full (everything) |"
            echo "| \`ghcr.io/vul-os/kerf:${VERSION}-mech\` | mechanical CAD stack |"
            echo "| \`ghcr.io/vul-os/kerf:${VERSION}-electronics\` | EDA / PCB stack |"
            echo "| \`ghcr.io/vul-os/kerf:${VERSION}-bim\` | BIM stack |"
            echo ""
            echo "## Download"
            echo ""
            echo "Grab the tarball for your platform from the assets below:"
            echo ""
            echo "| Platform | Asset |"
            echo "|----------|-------|"
            echo "| macOS (Apple Silicon) | \`kerf-${TAG}-macos-arm64.tar.gz\` |"
            echo "| macOS (Intel) | \`kerf-${TAG}-macos-x64.tar.gz\` |"
            echo "| Linux (x64) | \`kerf-${TAG}-linux-x64.tar.gz\` |"
            echo "| Source | \`kerf-${TAG}-src.tar.gz\` |"
            echo ""
            echo "## Desktop app"
            echo ""
            echo "A one-file native desktop binary — FastAPI plus a native OS window"
            echo "(WebView2 on Windows, WebKit on macOS/Linux), no Python install, no"
            echo "Docker, nothing to \`pip install\`. Just download and run."
            echo ""
            echo "| Platform | Asset |"
            echo "|----------|-------|"
            echo "| macOS (Apple Silicon) | \`kerf-desktop-${TAG}-macos-arm64\` |"
            echo "| Windows (x64) | \`kerf-desktop-${TAG}-windows-x64.exe\` |"
            echo "| Linux (x64) | \`kerf-desktop-${TAG}-linux-x64\` |"
            echo ""
            echo "**These binaries ship a LEAN persona.** OCCT B-rep modelling"
            echo "(pythonOCC — STEP/IGES import-export, real B-rep booleans,"
            echo "fillets/chamfers on B-rep solids) and real FEM (FEniCSx/dolfinx"
            echo "solves) are NOT included: both are distributed conda-forge-only,"
            echo "so neither can be \`pip install\`-ed or frozen by PyInstaller. For"
            echo "those, use \`pip install kerf[mech]\` (or the Docker image) in a"
            echo "conda environment that also has \`pythonocc-core\` and"
            echo "\`fenics-dolfinx\` installed — see docs/desktop-build.md and"
            echo "docs/local-install.md for the full breakdown of what each"
            echo "distribution channel does and doesn't include."
            echo ""
            echo "Every asset is covered by \`SHA256SUMS\` in this release, and"
            echo "carries a sigstore build-provenance attestation. Verify before"
            echo "running — see below."
            echo ""
            echo "## Verify a download by hand"
            echo ""
            echo '```'
            echo "curl -fsSLO https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/scripts/verify.sh"
            echo "bash verify.sh --tag ${TAG} --attest kerf-${TAG}-linux-x64.tar.gz"
            echo '```'
            echo ""
            echo "\`verify.sh\` fetches \`SHA256SUMS\`, looks up the exact entry for"
            echo "the asset and compares digests; it exits non-zero, with a distinct"
            echo "diagnostic, on a missing or malformed manifest, a missing entry, a"
            echo "truncated download or a digest mismatch. \`--attest\` additionally"
            echo "checks the sigstore build provenance (needs the \`gh\` CLI); without"
            echo "it, provenance is NOT checked and the script says so."
          } >> notes.md

      # Short-lived sigstore certificate minted from this job's OIDC identity —
      # no long-lived key, no repository secret, nothing to rotate. Attests
      # every file in release-out/ INCLUDING SHA256SUMS itself, so the
      # attestation on the manifest transitively covers every asset it names.
      - name: Attest build provenance (sigstore via OIDC — no long-lived key)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-out/*"

      # Publish the DIRECTORY, not a hand-listed set of names: the previous
      # `release-out/kerf-*` glob would have silently dropped any asset whose
      # name did not start with "kerf-", while SHA256SUMS still listed it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            release-out/*
