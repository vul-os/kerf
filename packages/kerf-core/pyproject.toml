[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerf-core"
version = "0.1.9"
description = "Kerf core: FastAPI app, plugin loader, shared infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "structlog>=24.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "moto[s3]>=5.0.0",
    # test_inprocess_workers.py imports kerf_workers to exercise the in-process
    # worker loader. kerf-core does not depend on it at runtime (the loader finds
    # it through the plugin entry point, if installed), but the TEST needs it
    # present — without this the suite hard-fails with ModuleNotFoundError in any
    # environment that installed kerf-core's dev extra alone.
    "kerf-workers>=0.1.0",
]

[project.scripts]
kerf-server = "kerf_core.__main__:main"

[project.entry-points."kerf.plugins"]
# kerf-core itself does not register as a plugin; it is the loader.

[tool.hatch.build.targets.wheel]
packages = ["src/kerf_core"]

# Deliberately no [tool.pytest.ini_options] here. A per-package section
# shadows the repo-root one: pytest resolves rootdir to the NEAREST
# pyproject.toml containing that table, so any invocation scoped to this
# package (e.g. `pytest packages/kerf-x/tests/`) would silently skip the
# repo-root conftest.py (asyncio-loop shim, tools.* namespace shim) and its
# addopts = "--import-mode=importlib". See decisions.md, "pytest rootdir
# footgun" (2026-08-09), for the full diagnosis and proof. Config for every
# package lives in the root pyproject.toml only — do not add one here.
